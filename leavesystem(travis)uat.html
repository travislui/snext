<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave System – Redirecting...</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacOSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.55;
      padding: 20px 14px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 28px 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      font-size: clamp(1.7rem, 6vw, 2.1rem);
      margin-bottom: 1.4em;
      color: #111;
    }

    p {
      margin-bottom: 1.3em;
      font-size: clamp(1rem, 4.2vw, 1.08rem);
    }

    .url-box {
      background: #f8f9fa;
      padding: 12px 14px;
      border-radius: 10px;
      font-family: 'SF Mono', 'Segoe UI Mono', Menlo, Monaco, monospace;
      font-size: 0.95rem;
      word-break: break-all;
      margin: 0.8em 0 1.4em;
      line-height: 1.4;
      border: 1px solid #e0e0e0;
    }

    .countdown-area {
      font-size: clamp(1.15rem, 4.8vw, 1.35rem);
      font-weight: 500;
      margin: 2.2em auto 2em;
      padding: 18px;
      background: #fff5f5;
      border-radius: 12px;
      border: 1px solid #ffe0e0;
      max-width: 380px;
      text-align: center;
    }

    #countdown {
      color: #c62828;
      font-weight: bold;
      min-width: 2.2ch;
      display: inline-block;
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: #0069d9;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
      text-align: center;
    }

    .btn:hover,
    .btn:active {
      background: #0056b3;
    }

    .small-note {
      margin-top: 1.6em;
      font-size: 0.9rem;
      color: #555;
    }

    @media (min-width: 480px) {
      body {
        padding: 40px 20px;
      }
      .container {
        padding: 36px 28px;
        max-width: 520px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Redirecting to New Site</h1>

  <p>The old address:</p>
  <div class="url-box">
    https://travislui.github.io/snext/leavesystem(travis).html
  </div>

  <p>is <strong>no longer available</strong>.</p>

  <div class="countdown-area">
    Redirecting in <span id="countdown">5</span> seconds...
  </div>

  <button class="btn" onclick="goNow()">
    Go to new Leave System →
  </button>

  <div class="small-note">
    or wait a moment • new site: leavesystem-ab5bd.web.app
  </div>
</div>

<script>
  let seconds = 5;
  const el = document.getElementById('countdown');

  const timer = setInterval(() => {
    seconds--;
    el.textContent = seconds;

    if (seconds <= 0) {
      clearInterval(timer);
      window.location.replace('https://leavesystem-ab5bd.web.app/');
    }
  }, 1000);

  function goNow() {
    clearInterval(timer);
    window.location.replace('https://leavesystem-ab5bd.web.app/');
  }
</script>

</body>
</html>
