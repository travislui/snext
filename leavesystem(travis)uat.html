<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leave System – Redirecting...</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f6f7f8;
      color: #1f2937;
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 32px 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.9rem, 7vw, 2.4rem);
      margin-bottom: 1.6em;
      color: #111827;
    }

    p {
      font-size: clamp(1.05rem, 4.5vw, 1.15rem);
      margin-bottom: 1.4em;
    }

    .url-box {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.98rem;
      word-break: break-all;
      margin: 1.2em auto 1.8em;
      max-width: 100%;
      border: 1px solid #e2e8f0;
      text-align: left;
      line-height: 1.45;
    }

    .countdown-area {
      font-size: clamp(1.2rem, 5vw, 1.4rem);
      font-weight: 500;
      margin: 2.4em auto;
      padding: 20px;
      background: #fef2f2;
      border-radius: 12px;
      border: 1px solid #fecaca;
      max-width: 400px;
    }

    #countdown {
      color: #dc2626;
      font-weight: bold;
      min-width: 2.5ch;
      display: inline-block;
    }

    .btn {
      display: inline-block;
      width: 100%;
      max-width: 360px;
      margin: 0 auto 1.2em;
      padding: 16px 28px;
      font-size: 1.15rem;
      font-weight: 600;
      color: white;
      background: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover,
    .btn:active {
      background: #1d4ed8;
    }

    @media (min-width: 480px) {
      .container {
        padding: 40px 32px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Redirecting to New Site</h1>

  <p>The old address:</p>
  
  <div class="url-box">
    https://travislui.github.io/snext/leavesystem(travis).html
  </div>

  <p>is <strong>no longer available</strong></p>

  <div class="countdown-area">
    Redirecting in <span id="countdown">5</span> seconds...
  </div>

  <button class="btn" onclick="goNow()">
    Go to new Leave System →
  </button>
</div>

<script>
  let seconds = 5;
  const el = document.getElementById('countdown');

  const timer = setInterval(() => {
    seconds--;
    el.textContent = seconds;

    if (seconds <= 0) {
      clearInterval(timer);
      window.location.replace('https://leavesystem-ab5bd.web.app/');
    }
  }, 1000);

  function goNow() {
    clearInterval(timer);
    window.location.replace('https://leavesystem-ab5bd.web.app/');
  }
</script>

</body>
</html>
