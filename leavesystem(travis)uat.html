<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #countdown {
            font-weight: bold;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redirecting to New Site</h1>
        <p>The old link https://travislui.github.io/snext/leavesystem(travis).html is no longer being used.</p>
        <p>Please wait <span id="countdown">5</span> seconds, then you will be redirected to the new link yyyyyy.com.</p>
        <p>Or click the button below to go now.</p>
        <button onclick="redirectNow()">Go to https://leavesystem-ab5bd.web.app/</button>
    </div>

    <script>
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'https://leavesystem-ab5bd.web.app/';
            }
        }, 1000);

        function redirectNow() {
            window.location.href = 'https://leavesystem-ab5bd.web.app/';
        }
    </script>
</body>
</html>
